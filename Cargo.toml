[workspace]
members = ["crates/parakatt-core", "crates/parakatt-cli"]
exclude = ["vendor/parakeet-rs", "fuzz"]
resolver = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[patch.crates-io]
parakeet-rs = { path = "vendor/parakeet-rs" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
panic = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
