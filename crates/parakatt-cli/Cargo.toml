[package]
name = "parakatt-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local file transcription with Parakatt"
publish = false

[[bin]]
name = "parakatt"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "7"
hound = "3.5"
parakatt-core = { path = "../parakatt-core", version = "0.7.3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
