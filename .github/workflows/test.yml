name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  CARGO_SWIFT_VERSION: "0.11.1"

jobs:
  rust:
    name: Rust Tests & Lint
    runs-on: macos-15
    outputs:
      macos14_available: ${{ steps.macos14.outputs.available }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Select build Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"

      - name: Verify release version and tooling
        run: |
          ./scripts/sync-version.sh --check
          python3 scripts/test_release_tools.py
          python3 scripts/test_benchmark_gates.py
          python3 scripts/test_benchmark_worker.py
          python3 scripts/test_media_build_environment.py

      - name: Check macOS 14 hosted runner availability
        id: macos14
        run: |
          python3 - <<'PY'
          import datetime, os
          # GitHub retires this image on 2026-11-02. Release preparation must
          # use an actual macOS 14 machine after that date.
          available = datetime.datetime.now(datetime.timezone.utc).date() < datetime.date(2026, 11, 2)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'available={str(available).lower()}\n')
          if not available:
              print('::warning::The macOS 14 hosted image is retired. Record a manual minimum-OS runtime check before release.')
          PY

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy, rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: ". -> target"

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --locked -p parakatt-core --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked -p parakatt-core

      - name: Require critical-module coverage to stay at or above base
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.9.1 --locked
          make coverage-check

      - name: Save Rust coverage reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rust-coverage
          path: target/coverage/*rust.json

      - name: Audit locked dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --json > dependency-advisories.json

      - name: Save advisory findings
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dependency-advisories
          path: dependency-advisories.json

  swift:
    name: Swift Build & Tests
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      inputs_ready: ${{ steps.inputs-ready.outputs.ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-apple-darwin
      - name: Identify native build environment
        id: environment
        run: python3 scripts/ci_build_inputs.py environment >> "$GITHUB_OUTPUT"
      - name: Cache pinned build tools
        id: tools
        uses: actions/cache/restore@v6.1.0
        with:
          path: target/ci-tools
          key: macos-ci-tools-v2-${{ steps.environment.outputs.environment }}-${{ env.CARGO_SWIFT_VERSION }}-${{ hashFiles('scripts/install-xcodegen.sh', 'scripts/install-swiftlint.py', 'rust-toolchain.toml') }}
      - name: Cache generated Rust framework and Swift bindings
        id: bindings
        uses: actions/cache@v6.1.0
        with:
          path: |
            ParakattCore
            .swift-package-fingerprint
          key: swift-webgpu-v2-${{ steps.environment.outputs.environment }}-${{ env.CARGO_SWIFT_VERSION }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'Makefile', '.cargo/**', 'crates/**/*.rs', 'crates/**/*.toml', 'crates/**/*.json', 'vendor/**/*.rs', 'vendor/**/Cargo.toml', 'scripts/swift-package.py', 'scripts/ci_build_inputs.py') }}
      - name: Cache Rust build dependencies
        if: steps.bindings.outputs.cache-hit != 'true' || steps.tools.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: ". -> target"
          key: swift-inputs
      - name: Install pinned build tools on cache miss
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          ./scripts/install-xcodegen.sh
          mkdir -p target/ci-tools/bin
          cp "$RUNNER_TEMP/parakatt-xcodegen/.build/release/xcodegen" target/ci-tools/bin/
          mkdir -p target/ci-tools/share/xcodegen
          cp -R "$RUNNER_TEMP/parakatt-xcodegen/SettingPresets" target/ci-tools/share/xcodegen/
          cargo install cargo-swift --version "$CARGO_SWIFT_VERSION" --locked --root target/ci-tools
          python3 scripts/install-swiftlint.py
          cp target/tools/bin/swiftlint target/ci-tools/bin/
      - name: Select and verify pinned tools
        run: |
          echo "$PWD/target/ci-tools/bin" >> "$GITHUB_PATH"
          test "$(target/ci-tools/bin/xcodegen --version)" = 'Version: 2.46.0'
          test "$(target/ci-tools/bin/swiftlint version)" = '0.65.1'
          test -f target/ci-tools/share/xcodegen/SettingPresets/base.yml
          test -f target/ci-tools/share/xcodegen/SettingPresets/Configs/debug.yml
          test -x target/ci-tools/bin/cargo-swift
      # rust-cache prunes target/ in its post-job hook. Save tools before that runs.
      - name: Save verified build tools before Rust cache cleanup
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: target/ci-tools
          key: ${{ steps.tools.outputs.cache-primary-key }}
      - name: Check Swift sources
        run: target/ci-tools/bin/swiftlint lint --strict --no-cache
      - name: Build Rust framework and generate bindings on cache miss
        if: steps.bindings.outputs.cache-hit != 'true'
        run: make swift-package
      - name: Archive prepared Swift inputs
        run: python3 scripts/ci_build_inputs.py pack swift target/ci-artifacts/swift-inputs.tar.gz --revision "$GITHUB_SHA" --environment '${{ steps.environment.outputs.environment }}'
      - name: Share Swift inputs with all test variants
        uses: actions/upload-artifact@v7.0.2
        with:
          name: swift-build-inputs
          path: target/ci-artifacts/swift-inputs.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Cache prepared media binaries and source notices
        id: media
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            target/media-tools
            target/playback-engine/VLCKit.framework
            target/playback-engine/COPYING.txt
            target/playback-engine/licenses
            target/playback-engine/stamp
          key: macos-media-v1-${{ steps.environment.outputs.environment }}-${{ hashFiles('config/media-tools.json', 'config/playback-engine.json', 'config/media-notices/**', 'config/media-runtime.entitlements', 'scripts/prepare-media-tools.py', 'scripts/prepare-playback-engine.py', 'scripts/media_tool_downloads.py', 'scripts/media_build_environment.py', 'scripts/collect-deno-notices.py', 'scripts/ci_build_inputs.py') }}
      - name: Cache checksum-verified dependency downloads
        id: media-downloads
        if: steps.media.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6.1.0
        with:
          path: target/media-cache
          key: macos-media-downloads-v1-${{ hashFiles('config/media-tools.json', 'config/playback-engine.json') }}
      - name: Test media dependency downloads
        run: python3 scripts/test_media_tool_downloads.py
      - name: Prepare pinned media dependencies
        run: make media-tools
      - name: Save prepared media before Rust cache cleanup
        if: steps.media.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            target/media-tools
            target/playback-engine/VLCKit.framework
            target/playback-engine/COPYING.txt
            target/playback-engine/licenses
            target/playback-engine/stamp
          key: ${{ steps.media.outputs.cache-primary-key }}
      - name: Save verified media downloads before Rust cache cleanup
        if: steps.media.outputs.cache-hit != 'true' && steps.media-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: target/media-cache
          key: ${{ steps.media-downloads.outputs.cache-primary-key }}
      - name: Archive prepared media inputs
        run: python3 scripts/ci_build_inputs.py pack media target/ci-artifacts/media-inputs.tar.gz --revision "$GITHUB_SHA" --environment '${{ steps.environment.outputs.environment }}'
      - name: Share media inputs with all test variants
        uses: actions/upload-artifact@v7.0.2
        with:
          name: media-build-inputs
          path: target/ci-artifacts/media-inputs.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Mark shared inputs ready
        id: inputs-ready
        run: echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Generate Xcode project without rebuilding dependencies
        run: xcodegen generate

      - name: Run Swift tests
        env:
          NSUnbufferedIO: "YES"
          TEST_RUNNER_PARAKATT_TEST_HEADLESS_PLAYBACK: "1"
        run: |
          set -o pipefail
          xcodebuild test \
            -project Parakatt.xcodeproj \
            -scheme Parakatt \
            -derivedDataPath target/xcode \
            -destination 'platform=macOS' \
            -only-testing:ParakattTests \
            -enableCodeCoverage YES -resultBundlePath target/coverage/Swift.xcresult \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO 2>&1 | tee target/swift-tests.log

      - name: Analyze Swift declarations and imports
        run: make swift-analysis COMPILER_LOG=target/swift-tests.log

      - name: Require settings-function coverage
        run: |
          xcrun xccov view --report --json target/coverage/Swift.xcresult > target/coverage/swift.json
          python3 scripts/coverage_gate.py swift target/coverage/swift.json

      - name: Save Swift coverage
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: swift-coverage
          path: target/coverage/swift.json

      - name: Build and verify release package
        if: github.event_name == 'push' || startsWith(github.head_ref, 'codex/release-') || startsWith(github.head_ref, 'release/')
        run: |
          brew install create-dmg
          make package
          ls dist/*.zip dist/*.dmg

      - name: Verify DMG and prepare release metadata
        if: github.event_name == 'push' || startsWith(github.head_ref, 'codex/release-') || startsWith(github.head_ref, 'release/')
        run: python3 scripts/prepare_release.py

      - name: Check bundled video playback
        env:
          CONFIGURATION: ${{ (github.event_name == 'push' || startsWith(github.head_ref, 'codex/release-') || startsWith(github.head_ref, 'release/')) && 'Release' || 'Debug' }}
        run: |
          APP="$(python3 scripts/build-products.py "$CONFIGURATION")/Parakatt.app"
          python3 scripts/smoke-app.py "$APP"
          "$APP/Contents/Helpers/MediaTools/ffmpeg" -v error -f lavfi -i testsrc2=size=128x72:rate=10:duration=6 -f lavfi -i sine=duration=6 -c:v mpeg4 -c:a flac target/playback-fixture.mkv
          python3 scripts/smoke-media.py "$APP" target/playback-fixture.mkv --playback --headless

      - name: Save release candidate
        if: github.event_name == 'push' || startsWith(github.head_ref, 'codex/release-') || startsWith(github.head_ref, 'release/')
        uses: actions/upload-artifact@v7.0.2
        with:
          name: parakatt-release-candidate-arm64
          path: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS
            dist/parakatt.rb
            dist/RELEASE_NOTES.md
          if-no-files-found: error

  swift-sanitizers:
    name: Swift Build & Tests${{ matrix.suffix }}
    needs: [swift]
    if: ${{ !cancelled() }}
    # A preparation failure must fail the required checks, without a macOS queue wait.
    runs-on: ${{ needs.swift.outputs.inputs_ready == 'true' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - flag: -enableThreadSanitizer
            suffix: " (Thread Sanitizer)"
          - flag: -enableAddressSanitizer
            suffix: " (Address Sanitizer)"
    steps:
      - name: Require successful shared preparation
        env:
          INPUTS_READY: ${{ needs.swift.outputs.inputs_ready }}
        run: test "$INPUTS_READY" = true
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - name: Identify native build environment
        id: environment
        run: python3 scripts/ci_build_inputs.py environment >> "$GITHUB_OUTPUT"
      - name: Download shared Swift inputs
        uses: actions/download-artifact@v8.0.2
        with:
          name: swift-build-inputs
          path: target/ci-artifacts
      - name: Download shared media inputs
        uses: actions/download-artifact@v8.0.2
        with:
          name: media-build-inputs
          path: target/ci-artifacts
      - name: Restore prepared inputs with framework links and executable permissions
        run: |
          python3 scripts/ci_build_inputs.py restore swift target/ci-artifacts/swift-inputs.tar.gz --revision "$GITHUB_SHA" --environment '${{ steps.environment.outputs.environment }}'
          python3 scripts/ci_build_inputs.py restore media target/ci-artifacts/media-inputs.tar.gz --revision "$GITHUB_SHA" --environment '${{ steps.environment.outputs.environment }}'
          echo "$PWD/target/ci-tools/bin" >> "$GITHUB_PATH"
      - name: Generate Xcode project without rebuilding dependencies
        run: xcodegen generate
      - name: Run sanitized Swift tests
        env:
          TEST_RUNNER_PARAKATT_TEST_HEADLESS_PLAYBACK: "1"
          SANITIZER_FLAG: ${{ matrix.flag }}
        run: |
          xcodebuild test -project Parakatt.xcodeproj -scheme Parakatt \
            -derivedDataPath target/xcode -destination 'platform=macOS' \
            -only-testing:ParakattTests "$SANITIZER_FLAG" YES \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO

  macos14:
    name: macOS 14 Candidate Runtime
    needs: [rust, swift]
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'codex/release-') && github.event.pull_request.head.repo.full_name == github.repository && needs.rust.outputs.macos14_available == 'true'
    runs-on: macos-14
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Select build Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"

      - name: Download the verified candidate
        uses: actions/download-artifact@v8.0.2
        with:
          name: parakatt-release-candidate-arm64
          path: target/macos14-candidate

      - name: Check candidate on the minimum OS
        run: |
          VERSION=$(cat VERSION)
          cd target/macos14-candidate
          shasum -a 256 -c SHA256SUMS
          ditto -x -k "Parakatt-${VERSION}-arm64.zip" app
          cd ../..
          python3 scripts/check_macos14_candidate.py target/macos14-candidate/app/Parakatt.app

      - name: Save minimum-OS evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: parakatt-macos14-runtime
          path: target/macos14-validation/*.json
          if-no-files-found: warn
