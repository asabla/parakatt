name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
  MACOSX_DEPLOYMENT_TARGET: "14.0"

jobs:
  rust:
    name: Rust Tests & Lint
    runs-on: macos-15
    outputs:
      macos14_available: ${{ steps.macos14.outputs.available }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Verify release version and tooling
        run: |
          ./scripts/sync-version.sh --check
          python3 scripts/test_release_tools.py

      - name: Check macOS 14 hosted runner availability
        id: macos14
        run: |
          python3 - <<'PY'
          import datetime, os
          # GitHub retires this image on 2026-11-02. Release preparation must
          # use an actual macOS 14 machine after that date.
          available = datetime.datetime.now(datetime.timezone.utc).date() < datetime.date(2026, 11, 2)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'available={str(available).lower()}\n')
          if not available:
              print('::warning::The macOS 14 hosted image is retired. Record a manual minimum-OS runtime check before release.')
          PY

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy, rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --locked -p parakatt-core --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked -p parakatt-core

      - name: Audit locked dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --json > dependency-advisories.json

      - name: Save advisory findings
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dependency-advisories
          path: dependency-advisories.json

  swift:
    name: Swift Build & Tests
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install build tools
        run: |
          brew install create-dmg
          ./scripts/install-xcodegen.sh
          cargo install cargo-swift --version 0.11.1 --locked

      - name: Build Rust core
        run: make rust

      - name: Test media dependency downloads
        run: python3 scripts/test_media_tool_downloads.py

      - name: Generate Swift package
        run: make swift-package

      - name: Generate Xcode project
        run: make xcode

      - name: Run Swift tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Parakatt.xcodeproj \
            -scheme Parakatt \
            -derivedDataPath target/xcode \
            -destination 'platform=macOS' \
            -only-testing:ParakattTests \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO
        env:
          NSUnbufferedIO: "YES"
          TEST_RUNNER_PARAKATT_TEST_HEADLESS_PLAYBACK: "1"

      - name: Build and verify release package
        run: |
          make package
          ls dist/*.zip dist/*.dmg

      - name: Verify DMG and prepare release metadata
        run: python3 scripts/prepare_release.py

      - name: Check bundled video playback
        run: |
          APP="$(python3 scripts/build-products.py Release)/Parakatt.app"
          "$APP/Contents/Helpers/MediaTools/ffmpeg" -v error -f lavfi -i testsrc2=size=128x72:rate=10:duration=6 -f lavfi -i sine=duration=6 -c:v mpeg4 -c:a flac target/playback-fixture.mkv
          python3 scripts/smoke-media.py "$APP" target/playback-fixture.mkv --playback --headless

      - name: Save release candidate
        uses: actions/upload-artifact@v7.0.1
        with:
          name: parakatt-release-candidate-arm64
          path: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS
            dist/parakatt.rb
            dist/RELEASE_NOTES.md
          if-no-files-found: error

  macos14:
    name: macOS 14 Candidate Runtime
    needs: [rust, swift]
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'codex/release-') && github.event.pull_request.head.repo.full_name == github.repository && needs.rust.outputs.macos14_available == 'true'
    runs-on: macos-14
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download the verified candidate
        uses: actions/download-artifact@v8.0.1
        with:
          name: parakatt-release-candidate-arm64
          path: target/macos14-candidate

      - name: Check candidate on the minimum OS
        run: |
          VERSION=$(cat VERSION)
          cd target/macos14-candidate
          shasum -a 256 -c SHA256SUMS
          ditto -x -k "Parakatt-${VERSION}-arm64.zip" app
          cd ../..
          python3 scripts/check_macos14_candidate.py target/macos14-candidate/app/Parakatt.app

      - name: Save minimum-OS evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: parakatt-macos14-runtime
          path: target/macos14-validation/*.json
          if-no-files-found: warn
