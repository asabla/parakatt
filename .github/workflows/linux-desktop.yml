name: Linux desktop

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pulseaudio-utils libegl1 libopengl0 libxcb-cursor0 libssl-dev pkg-config cmake mutter
      - name: Build and install the desktop frontend
        run: |
          make linux-desktop
          python3 -m venv --clear target/quality-venv
          target/quality-venv/bin/python -m pip install -r requirements-quality.txt
      - name: Check Linux sources and desktop behavior
        env:
          QT_QPA_PLATFORM: offscreen
          PARAKATT_TEST_QT: "1"
        run: |
          target/quality-venv/bin/ruff check linux scripts/build-linux.py scripts/install-linux-desktop.py
          target/quality-venv/bin/ruff format --check linux scripts/build-linux.py scripts/install-linux-desktop.py
          target/quality-venv/bin/pyright --project linux/pyrightconfig.json
          target/quality-venv/bin/pip-audit --strict --require-hashes --disable-pip -r linux/requirements.lock
          make linux-test
          target/linux-venv/bin/parakatt-desktop --diagnostics
      - name: Exercise the desktop on Mutter Wayland
        env:
          QT_QPA_PLATFORM: wayland
          XDG_SESSION_TYPE: wayland
          LIBGL_ALWAYS_SOFTWARE: "1"
          PARAKATT_TEST_QT: "1"
        run: |
          dbus-run-session -- bash -euo pipefail <<'BASH'
          XDG_RUNTIME_DIR=$(mktemp -d)
          export XDG_RUNTIME_DIR WAYLAND_DISPLAY=parakatt-ci
          mutter --headless --wayland --no-x11 --virtual-monitor 1280x800 \
            --wayland-display "$WAYLAND_DISPLAY" > target/mutter.log 2>&1 &
          compositor=$!
          cleanup() {
            kill "$compositor" 2>/dev/null || true
            wait "$compositor" 2>/dev/null || true
            rm -rf "$XDG_RUNTIME_DIR"
          }
          trap cleanup EXIT
          for _ in {1..100}; do
            [[ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]] && break
            kill -0 "$compositor" 2>/dev/null || break
            sleep 0.1
          done
          if [[ ! -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]]; then
            cat target/mutter.log
            exit 1
          fi
          make linux-test
          BASH
      - name: Verify real Linux desktop recognition and persistence
        run: |
          ORT_LIB_PATH="$PWD/target/linux-runtime/onnxruntime-linux-x64-1.31.0/lib" ORT_PREFER_DYNAMIC_LINK=1 \
          LD_LIBRARY_PATH="$PWD/target/linux-runtime/onnxruntime-linux-x64-1.31.0/lib" \
            cargo run --locked --release -p parakatt-core --example install_model -- target/linux-models parakeet-tdt-0.6b-v3
          python3 scripts/prepare-fixtures.py --languages en_us --count 1 --output target/linux-fixtures
          PARAKATT_TEST_MODELS="$PWD/target/linux-models" \
          PARAKATT_TEST_AUDIO="$(python3 -c 'import json; print(json.load(open("target/linux-fixtures/manifest.json"))["samples"][0]["path"])')" \
            PYTHONPATH=linux target/linux-venv/bin/python -m unittest discover -s linux/tests -p test_native.py -v
