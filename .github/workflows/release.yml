name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
  MACOSX_DEPLOYMENT_TARGET: "14.0"

jobs:
  build:
    name: Build and Release
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install build tools
        run: |
          brew install create-dmg
          ./scripts/install-xcodegen.sh
          cargo install cargo-swift --version 0.11.1 --locked

      - name: Build Rust core
        run: make rust

      - name: Generate Swift package
        run: make swift-package

      - name: Generate Xcode project
        run: make xcode

      - name: Verify Rust and Swift before packaging
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked
          xcodebuild test -project Parakatt.xcodeproj -scheme Parakatt -derivedDataPath target/xcode -destination 'platform=macOS' CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO
        env:
          PARAKATT_DATA_ROOT: ${{ github.workspace }}/target/release-test-data

      - name: Build Release
        run: make release

      - name: Get build products path
        id: build-path
        run: |
          BUILD_DIR=$(python3 scripts/build-products.py Release)
          echo "dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify stable launcher
        run: python3 scripts/verify-launcher.py

      - name: Swap in stable launcher
        run: |
          # Replace the Xcode-compiled launcher with the stable binary.
          # The stable launcher's CDHash never changes between releases, so
          # macOS TCC permissions (Accessibility, Microphone, Screen Recording)
          # persist across updates.
          cp bin/parakatt-launcher "${{ steps.build-path.outputs.dir }}/Parakatt.app/Contents/MacOS/Parakatt"

      - name: Verify stable launcher CDHash
        run: |
          python3 scripts/verify-app.py "${{ steps.build-path.outputs.dir }}/Parakatt.app"
          python3 scripts/smoke-app.py "${{ steps.build-path.outputs.dir }}/Parakatt.app"

      # TODO: Add Developer ID signing and notarization when an Apple Developer
      # Program membership is available. This would replace the self-signed
      # approach and allow Gatekeeper to pass the app without xattr workarounds.

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create zip
        run: |
          mkdir -p dist
          ditto -c -k --keepParent "${{ steps.build-path.outputs.dir }}/Parakatt.app" "dist/Parakatt-${{ steps.version.outputs.version }}-arm64.zip"

      - name: Create DMG
        run: |
          create-dmg \
            --volname "Parakatt" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Parakatt.app" 175 190 \
            --hide-extension "Parakatt.app" \
            --app-drop-link 425 190 \
            "dist/Parakatt-${{ steps.version.outputs.version }}-arm64.dmg" \
            "${{ steps.build-path.outputs.dir }}/Parakatt.app"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/Parakatt-${{ steps.version.outputs.version }}-arm64.zip
            dist/Parakatt-${{ steps.version.outputs.version }}-arm64.dmg
            reports/maintenance/*.md
            reports/maintenance/*.json
            crates/parakatt-core/backend-validation.json

