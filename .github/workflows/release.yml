name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
  MACOSX_DEPLOYMENT_TARGET: "14.0"

jobs:
  build:
    name: Build and Release
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Verify release version and tooling
        id: version
        run: |
          ./scripts/sync-version.sh --check --tag "$GITHUB_REF_NAME"
          python3 scripts/test_release_tools.py
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: aarch64-apple-darwin
          components: clippy, rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install build tools
        run: |
          brew install create-dmg
          ./scripts/install-xcodegen.sh
          cargo install cargo-swift --version 0.11.1 --locked

      - name: Build Rust core
        run: make rust

      - name: Test media dependency downloads
        run: python3 scripts/test_media_tool_downloads.py

      - name: Generate Swift package
        run: make swift-package

      - name: Generate Xcode project
        run: make xcode

      - name: Verify Rust and Swift before packaging
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked
          xcodebuild test -project Parakatt.xcodeproj -scheme Parakatt -derivedDataPath target/xcode -destination 'platform=macOS' -only-testing:ParakattTests CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO
        env:
          PARAKATT_DATA_ROOT: ${{ github.workspace }}/target/release-test-data
          NSUnbufferedIO: "YES"
          TEST_RUNNER_PARAKATT_TEST_HEADLESS_PLAYBACK: "1"

      - name: Audit locked dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --json > dependency-advisories.json

      - name: Build and verify release package
        run: make package

      - name: Check bundled video playback
        run: |
          APP="$(python3 scripts/build-products.py Release)/Parakatt.app"
          "$APP/Contents/Helpers/MediaTools/ffmpeg" -v error -f lavfi -i testsrc2=size=128x72:rate=10:duration=6 -f lavfi -i sine=duration=6 -c:v mpeg4 -c:a flac target/playback-fixture.mkv
          python3 scripts/smoke-media.py "$APP" target/playback-fixture.mkv --playback --headless

      - name: Verify DMG and prepare release metadata
        run: |
          python3 scripts/prepare_release.py
          cp dependency-advisories.json dist/dependency-advisories.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            dist/Parakatt-${{ steps.version.outputs.version }}-arm64.zip
            dist/Parakatt-${{ steps.version.outputs.version }}-arm64.dmg
            dist/Parakatt-${{ steps.version.outputs.version }}-media-sources.zip
            dist/SHA256SUMS
            dist/parakatt.rb
            dist/dependency-advisories.json
            reports/maintenance/*.md
            reports/maintenance/*.json
            crates/parakatt-core/backend-validation.json
            reports/releases/${{ steps.version.outputs.version }}.md

      - name: Prepare Homebrew tap update
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not configured. Install the attached parakatt.rb in asabla/homebrew-tap after checking the release DMG."
            exit 0
          fi
          python3 scripts/prepare_homebrew.py "dist/Parakatt-$(cat VERSION)-arm64.dmg" --update-tap
